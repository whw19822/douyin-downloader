appId: com.douyinbatchstudio.app
productName: 抖存批量工作台
copyright: Copyright © 2026 Douyin Batch Studio
asar: true

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.bin"
  - "!.playwright-cli/**"
  - "!Downloaded/**"
  - "!release/**"

mac:
  category: public.app-category.utilities
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: "${name}-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: "${productName} ${version}"
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
