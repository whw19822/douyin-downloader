name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            script: dist:mac:arm64
          - os: macos-15-intel
            arch: x64
            script: dist:mac:x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests & lint
        run: |
          npm test
          npm run lint

      - name: Package macOS DMG & ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }}

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: douyin-batch-studio-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
